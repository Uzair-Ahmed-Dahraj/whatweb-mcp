name: whatweb-mcp
description: Website technology fingerprinting for AI agents, powered by WhatWeb. Multi-arch Docker.
vendor: Devkind
homepage: https://devkind.com.au/services
license: MIT
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      timeout:
        type: number
        description: Per-scan timeout in seconds
        default: 300
      maxConcurrent:
        type: number
        description: Maximum concurrent scans
        default: 2
  commandFunction: |-
    (config) => ({
      command: "docker",
      args: ["run", "-i", "--rm", "--memory=512m", "--cpus=0.5", "--pids-limit=100", "-e", `WHATWEB_TIMEOUT=${config.timeout ?? 300}`, "-e", `WHATWEB_MAX_CONCURRENT=${config.maxConcurrent ?? 2}`, "devkind/whatweb-mcp:latest"]
    })
